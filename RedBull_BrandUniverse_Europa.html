<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Bull — Brand Universe Europa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#D40000;--red2:#FF2020;--red-dim:rgba(212,0,0,0.12);
  --silver:#B8B8B8;--bg:#080808;--bg2:#111;--bg3:#1A1A1A;
  --text:#E4E4E4;--muted:#666;--border:rgba(255,255,255,0.07);
  --panel-w:440px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;display:flex;flex-direction:column}

/* HEADER */
header{
  display:flex;align-items:center;gap:24px;
  padding:0 28px;height:54px;flex-shrink:0;
  border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,rgba(212,0,0,0.04) 0%,transparent 40%);
}
.hd-brand{display:flex;align-items:baseline;gap:10px}
.hd-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:.1em;color:var(--red);text-transform:uppercase}
.hd-sep{color:var(--muted);font-size:14px}
.hd-sub{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:20px}
.legend{display:flex;gap:14px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.leg-dot{width:7px;height:7px;border-radius:50%}
.dim-count{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.06em;border:1px solid var(--border);padding:3px 10px;border-radius:20px}

/* MAIN LAYOUT */
.layout{display:flex;flex:1;overflow:hidden;position:relative}

/* MAP AREA */
.map-area{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.map-area::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 60% at 50% 50%,rgba(212,0,0,0.04) 0%,transparent 70%);
  pointer-events:none;
}

/* SVG styles */
#umap{max-width:100%;max-height:100%;cursor:default}
.dim-node{cursor:pointer}
.dim-node .nc{transition:all .22s ease}
.dim-node:hover .nc{filter:drop-shadow(0 0 8px currentColor)}
.dim-node.active .nc{filter:drop-shadow(0 0 12px currentColor)}
.conn-line{transition:all .22s ease}

/* DETAIL PANEL */
.panel{
  width:var(--panel-w);flex-shrink:0;
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  background:var(--bg2);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.panel-header{
  padding:20px 24px 16px;flex-shrink:0;
  border-bottom:1px solid var(--border);
}
.ph-dim{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.ph-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:32px;letter-spacing:.04em;line-height:1;text-transform:uppercase}
.ph-question{font-size:13px;color:var(--muted);font-style:italic;margin-top:6px}
.ph-status{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:11px;padding:3px 10px;border-radius:12px}
.panel-body{flex:1;overflow-y:auto;padding:20px 24px}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* CONTENT STYLES */
.section{margin-bottom:24px}
.section-title{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.dim-table{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.55}
.dim-table td{padding:7px 10px;border:1px solid rgba(255,255,255,0.06);vertical-align:top}
.dim-table tr:first-child td{background:rgba(255,255,255,0.04);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dim-table .cell-key{width:38%;color:var(--silver);font-weight:500}
.dim-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.dim-list li{font-size:13px;line-height:1.55;padding-left:14px;position:relative;color:var(--text)}
.dim-list li::before{content:'–';position:absolute;left:0;color:var(--red)}
.dim-list li b{color:var(--silver)}
.dim-text{font-size:13px;line-height:1.65;color:#ccc;margin-bottom:10px}
.rule-row{display:flex;gap:8px;margin-bottom:6px;font-size:12.5px;line-height:1.5}
.rule-tag{flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;padding:2px 7px;border-radius:3px;letter-spacing:.05em;margin-top:1px}
.tag-si{background:rgba(34,197,94,.15);color:#4ade80}
.tag-no{background:rgba(212,0,0,.15);color:#f87171}
.tag-cuidado{background:rgba(234,179,8,.12);color:#fbbf24}
.ley{margin-bottom:12px;padding-left:12px;border-left:2px solid var(--red)}
.ley b{color:var(--red);font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.04em;display:block;margin-bottom:2px}
.ley span{font-size:12.5px;color:#bbb;line-height:1.6}
.timeline-item{display:grid;grid-template-columns:52px 1fr;gap:10px;margin-bottom:8px;align-items:start}
.tl-year{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:var(--red)}
.tl-text{font-size:12.5px;color:#bbb;line-height:1.55;padding-top:2px}
.sacred{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.sacred-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.sacred-text{font-size:12.5px;color:#bbb;line-height:1.55}
.sacred-text b{color:var(--silver);display:block;font-size:13px;margin-bottom:1px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:500;margin:2px}
.field-grid{display:flex;flex-direction:column;gap:0}
.field-item{display:grid;grid-template-columns:140px 1fr;border-bottom:1px solid var(--border);padding:8px 0}
.field-item:first-child{border-top:1px solid var(--border)}
.field-k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-right:12px;padding-top:1px}
.field-v{font-size:13px;color:var(--text);line-height:1.55}

/* HINT */
.hint{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
  pointer-events:none;transition:opacity .3s;
}
</style>
</head>
<body>

<header>
  <div class="hd-brand">
    <span class="hd-logo">Red Bull</span>
    <span class="hd-sep">/</span>
    <span class="hd-sub">Brand Universe — Europa</span>
  </div>
  <div class="hd-right">
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#22C55E"></div>Definido (7)</div>
      <div class="leg"><div class="leg-dot" style="background:#EAB308"></div>Parcial (1)</div>
    </div>
    <div class="dim-count">8 Dimensiones</div>
  </div>
</header>

<div class="layout">
  <div class="map-area">
    <svg id="umap" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1A0000" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow-red"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>

      <!-- Background glow -->
      <circle cx="350" cy="350" r="280" fill="url(#bgGrad)"/>

      <!-- Orbit rings -->
      <circle cx="350" cy="350" r="100" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
      <circle cx="350" cy="350" r="170" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
      <circle cx="350" cy="350" r="245" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
      <circle cx="350" cy="350" r="300" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5" stroke-dasharray="2 8"/>

      <!-- Radial grid lines -->
      <line x1="350" y1="350" x2="350" y2="40" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
      <line x1="350" y1="350" x2="523" y2="177" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
      <line x1="350" y1="350" x2="600" y2="350" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
      <line x1="350" y1="350" x2="523" y2="523" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
      <line x1="350" y1="350" x2="350" y2="660" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
      <line x1="350" y1="350" x2="177" y2="523" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
      <line x1="350" y1="350" x2="100" y2="350" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
      <line x1="350" y1="350" x2="177" y2="177" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>

      <!-- Connection lines -->
      <line id="conn-narrativas"       class="conn-line" x1="350" y1="350" x2="350" y2="105" stroke="rgba(232,93,36,0.15)"  stroke-width="0.8"/>
      <line id="conn-comunidades"      class="conn-line" x1="350" y1="350" x2="523" y2="177" stroke="rgba(242,166,35,0.15)" stroke-width="0.8"/>
      <line id="conn-sensaciones"      class="conn-line" x1="350" y1="350" x2="595" y2="350" stroke="rgba(226,75,74,0.15)"  stroke-width="0.8"/>
      <line id="conn-reglas"           class="conn-line" x1="350" y1="350" x2="523" y2="523" stroke="rgba(168,85,247,0.15)" stroke-width="0.8"/>
      <line id="conn-mitologia"        class="conn-line" x1="350" y1="350" x2="350" y2="595" stroke="rgba(55,138,221,0.15)" stroke-width="0.8"/>
      <line id="conn-escenarios"       class="conn-line" x1="350" y1="350" x2="177" y2="523" stroke="rgba(29,158,117,0.15)" stroke-width="0.8"/>
      <line id="conn-expansion"        class="conn-line" x1="350" y1="350" x2="105" y2="350" stroke="rgba(34,211,238,0.15)" stroke-width="0.8"/>
      <line id="conn-comunidad_design" class="conn-line" x1="350" y1="350" x2="177" y2="177" stroke="rgba(148,163,184,0.12)" stroke-width="0.8"/>

      <!-- NARRATIVAS node (350,105) -->
      <g class="dim-node" id="nd-narrativas" data-id="narrativas" onclick="selectDim('narrativas')">
        <circle class="nc" cx="350" cy="105" r="62" fill="rgba(232,93,36,0.07)" stroke="#E85D24" stroke-width="1.2" style="color:#E85D24"/>
        <circle cx="350" cy="105" r="50" fill="none" stroke="rgba(232,93,36,0.12)" stroke-width="0.5"/>
        <text x="350" y="101" text-anchor="middle" dominant-baseline="central" fill="#E85D24" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="13" letter-spacing="1">NARRATIVAS</text>
        <text x="350" y="116" text-anchor="middle" dominant-baseline="central" fill="rgba(232,93,36,0.55)" font-family="'Barlow',sans-serif" font-size="9.5" font-style="italic">¿Qué se cuenta?</text>
        <circle cx="382" cy="73" r="5" fill="#22C55E" stroke="#080808" stroke-width="1.5"/>
      </g>

      <!-- COMUNIDADES node (523,177) -->
      <g class="dim-node" id="nd-comunidades" data-id="comunidades" onclick="selectDim('comunidades')">
        <circle class="nc" cx="523" cy="177" r="62" fill="rgba(242,166,35,0.07)" stroke="#F2A623" stroke-width="1.2" style="color:#F2A623"/>
        <circle cx="523" cy="177" r="50" fill="none" stroke="rgba(242,166,35,0.12)" stroke-width="0.5"/>
        <text x="523" y="173" text-anchor="middle" dominant-baseline="central" fill="#F2A623" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="12" letter-spacing="1">COMUNIDADES</text>
        <text x="523" y="188" text-anchor="middle" dominant-baseline="central" fill="rgba(242,166,35,0.55)" font-family="'Barlow',sans-serif" font-size="9.5" font-style="italic">¿Quiénes habitan?</text>
        <circle cx="555" cy="145" r="5" fill="#22C55E" stroke="#080808" stroke-width="1.5"/>
      </g>

      <!-- SENSACIONES node (595,350) -->
      <g class="dim-node" id="nd-sensaciones" data-id="sensaciones" onclick="selectDim('sensaciones')">
        <circle class="nc" cx="595" cy="350" r="62" fill="rgba(226,75,74,0.07)" stroke="#E24B4A" stroke-width="1.2" style="color:#E24B4A"/>
        <circle cx="595" cy="350" r="50" fill="none" stroke="rgba(226,75,74,0.12)" stroke-width="0.5"/>
        <text x="595" y="346" text-anchor="middle" dominant-baseline="central" fill="#E24B4A" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="12" letter-spacing="1">SENSACIONES</text>
        <text x="595" y="361" text-anchor="middle" dominant-baseline="central" fill="rgba(226,75,74,0.55)" font-family="'Barlow',sans-serif" font-size="9.5" font-style="italic">¿Cómo se siente?</text>
        <circle cx="627" cy="318" r="5" fill="#22C55E" stroke="#080808" stroke-width="1.5"/>
      </g>

      <!-- REGLAS node (523,523) -->
      <g class="dim-node" id="nd-reglas" data-id="reglas" onclick="selectDim('reglas')">
        <circle class="nc" cx="523" cy="523" r="62" fill="rgba(168,85,247,0.07)" stroke="#A855F7" stroke-width="1.2" style="color:#A855F7"/>
        <circle cx="523" cy="523" r="50" fill="none" stroke="rgba(168,85,247,0.12)" stroke-width="0.5"/>
        <text x="523" y="519" text-anchor="middle" dominant-baseline="central" fill="#A855F7" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="14" letter-spacing="1">REGLAS</text>
        <text x="523" y="534" text-anchor="middle" dominant-baseline="central" fill="rgba(168,85,247,0.55)" font-family="'Barlow',sans-serif" font-size="9.5" font-style="italic">¿Qué es posible?</text>
        <circle cx="555" cy="491" r="5" fill="#22C55E" stroke="#080808" stroke-width="1.5"/>
      </g>

      <!-- MITOLOGÍA node (350,595) -->
      <g class="dim-node" id="nd-mitologia" data-id="mitologia" onclick="selectDim('mitologia')">
        <circle class="nc" cx="350" cy="595" r="62" fill="rgba(55,138,221,0.07)" stroke="#378ADD" stroke-width="1.2" style="color:#378ADD"/>
        <circle cx="350" cy="595" r="50" fill="none" stroke="rgba(55,138,221,0.12)" stroke-width="0.5"/>
        <text x="350" y="591" text-anchor="middle" dominant-baseline="central" fill="#378ADD" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="13" letter-spacing="1">MITOLOGÍA</text>
        <text x="350" y="606" text-anchor="middle" dominant-baseline="central" fill="rgba(55,138,221,0.55)" font-family="'Barlow',sans-serif" font-size="9.5" font-style="italic">¿Cuál es el origen?</text>
        <circle cx="382" cy="563" r="5" fill="#22C55E" stroke="#080808" stroke-width="1.5"/>
      </g>

      <!-- ESCENARIOS node (177,523) -->
      <g class="dim-node" id="nd-escenarios" data-id="escenarios" onclick="selectDim('escenarios')">
        <circle class="nc" cx="177" cy="523" r="62" fill="rgba(29,158,117,0.07)" stroke="#1D9E75" stroke-width="1.2" style="color:#1D9E75"/>
        <circle cx="177" cy="523" r="50" fill="none" stroke="rgba(29,158,117,0.12)" stroke-width="0.5"/>
        <text x="177" y="519" text-anchor="middle" dominant-baseline="central" fill="#1D9E75" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="13" letter-spacing="1">ESCENARIOS</text>
        <text x="177" y="534" text-anchor="middle" dominant-baseline="central" fill="rgba(29,158,117,0.55)" font-family="'Barlow',sans-serif" font-size="9.5" font-style="italic">¿Cuál es el mapa?</text>
        <circle cx="209" cy="491" r="5" fill="#22C55E" stroke="#080808" stroke-width="1.5"/>
      </g>

      <!-- EXPANSIÓN node (105,350) -->
      <g class="dim-node" id="nd-expansion" data-id="expansion" onclick="selectDim('expansion')">
        <circle class="nc" cx="105" cy="350" r="62" fill="rgba(34,211,238,0.07)" stroke="#22D3EE" stroke-width="1.2" style="color:#22D3EE"/>
        <circle cx="105" cy="350" r="50" fill="none" stroke="rgba(34,211,238,0.12)" stroke-width="0.5"/>

        <text x="105" y="361" text-anchor="middle" dominant-baseline="central" fill="rgba(34,211,238,0.55)" font-family="'Barlow',sans-serif" font-size="9.5" font-style="italic">¿Hacia dónde crece?</text>
        <circle cx="137" cy="318" r="5" fill="#22C55E" stroke="#080808" stroke-width="1.5"/>

        <circle class="nc" cx="177" cy="177" r="62" fill="rgba(148,163,184,0.05)" stroke="#94A3B8" stroke-width="1.2" style="color:#94A3B8"/>
        <circle cx="177" cy="177" r="50" fill="none" stroke="rgba(148,163,184,0.1)" stroke-width="0.5"/>
        <text x="177" y="168" text-anchor="middle" dominant-baseline="central" fill="#94A3B8" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="12" letter-spacing="1">DISEÑO DE</text>
        <text x="177" y="182" text-anchor="middle" dominant-baseline="central" fill="#94A3B8" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="12" letter-spacing="1">COMUNIDAD</text>
        <text x="177" y="196" text-anchor="middle" dominant-baseline="central" fill="rgba(148,163,184,0.5)" font-family="'Barlow',sans-serif" font-size="9.5" font-style="italic">¿Cómo se interactúa?</text>

      <!-- CENTER node -->
      <g id="nd-platform" onclick="selectDim('brand_platform')" style="cursor:pointer">
        <circle cx="350" cy="350" r="78" fill="rgba(212,0,0,0.06)" stroke="#D40000" stroke-width="1.5" filter="url(#glow-red)"/>
        <circle cx="350" cy="350" r="64" fill="rgba(212,0,0,0.04)" stroke="rgba(212,0,0,0.3)" stroke-width="0.5"/>
        <text x="350" y="340" text-anchor="middle" dominant-baseline="central" fill="#D40000" font-family="'Barlow Condensed',sans-serif" font-weight="900" font-size="18" letter-spacing="2">RED BULL</text>
        <text x="350" y="358" text-anchor="middle" dominant-baseline="central" fill="rgba(212,0,0,0.7)" font-family="'Barlow Condensed',sans-serif" font-weight="600" font-size="11" letter-spacing="1.5">BRAND PLATFORM</text>
        <text x="350" y="372" text-anchor="middle" dominant-baseline="central" fill="rgba(184,184,184,0.4)" font-family="'Barlow',sans-serif" font-size="9" letter-spacing="0.5">Est. 1987, Austria</text>
      </g>
    </svg>
    <div class="hint" id="hint">Seleccioná una dimensión para explorar</div>
  </div>

  <!-- DETAIL PANEL -->
  <div class="panel" id="panel">
    <div class="panel-header" id="panel-header">
      <div class="ph-dim" id="ph-dim" style="color:#D40000">Núcleo del universo</div>
      <div class="ph-title" id="ph-title" style="color:#D40000">Brand Platform</div>
      <div class="ph-question" id="ph-question">¿Quién es Red Bull?</div>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </div>
</div>

<script>
const DIMS = {
brand_platform:{
  label:'Brand Platform',sublabel:'Núcleo del universo',question:'¿Quién es Red Bull?',color:'#D40000',status:'defined',
  body:`
    <div class="section">
      <div class="section-title">Identidad core</div>
      <div class="field-grid">
        <div class="field-item"><span class="field-k">Esencia</span><span class="field-v">La fuerza que libera el potencial humano de quienes se niegan a aceptar lo ordinario.</span></div>
        <div class="field-item"><span class="field-k">Propósito</span><span class="field-v">Hacer posible lo que el mundo dice que es imposible — y documentarlo para que otros crean que ellos también pueden.</span></div>
        <div class="field-item"><span class="field-k">Arquetipo</span><span class="field-v">Héroe + Explorador. No el héroe que salva al mundo: el que se enfrenta a sus propios límites y gana.</span></div>
        <div class="field-item"><span class="field-k">Beneficio funcional</span><span class="field-v">Energía para rendir al máximo cuando más importa.</span></div>
        <div class="field-item"><span class="field-k">Beneficio emocional</span><span class="field-v">La certeza de que los límites no son reales — son puntos de partida.</span></div>

mitologia:{
  label:'Mitología',sublabel:'Dimensión 5',question:'¿Cuál es el origen del universo Red Bull Europa?',color:'#378ADD',status:'defined',
  body:`
    <div class="section">
      <div class="section-title">El mito fundante</div>
      <p class="dim-text">En 1982, Dietrich Mateschitz llega a Bangkok con un jet lag paralizante y descubre Krating Daeng — "Toro Rojo" en tailandés. En 3 años de desarrollo y con sus ahorros personales, lanza Red Bull en Austria en 1987.</p>
      <p class="dim-text">El mundo de las bebidas lo ignora. Los analistas dicen que la categoría no existe. <strong style="color:#e4e4e4">Mateschitz crea la categoría.</strong> Este es el mito fundante: el loco que tenía razón, que creó las reglas de su propio juego porque no aceptó las del juego existente.</p>
    </div>
    <div class="section">
      <div class="section-title">Línea de tiempo sagrada — Europa</div>
      <div class="timeline-item"><span class="tl-year">1987</span><span class="tl-text">Lanzamiento en Austria. Nace el universo occidental. Nace la categoría de bebidas energéticas en Europa.</span></div>
      <div class="timeline-item"><span class="tl-year">1989</span><span class="tl-text">Expansión a Alemania, Hungría y Reino Unido. El universo comienza a orbitar más allá del planeta de origen.</span></div>
      <div class="timeline-item"><span class="tl-year">2004</span><span class="tl-text">Adquisición de Jaguar Racing F1. Red Bull se convierte en constructor. El universo escala a un nivel sin precedentes en deportes europeos.</span></div>
      <div class="timeline-item"><span class="tl-year">2010–13</span><span class="tl-text">Cuatro títulos consecutivos de F1 con Vettel. La era de mayor densidad mitológica en Europa. Lo imposible se repite cuatro veces.</span></div>
      <div class="timeline-item"><span class="tl-year">2012</span><span class="tl-text">Stratos: Felix Baumgartner —austriaco, habitante del planeta de origen— salta desde el espacio. 128.000 pies. 8 millones de espectadores en live en YouTube. El hito mitológico cumbre.</span></div>
      <div class="timeline-item"><span class="tl-year">2019</span><span class="tl-text">Red Bull Gaming Sphere abre en Londres. El universo expande su mitología al territorio europeo del gaming.</span></div>
      <div class="timeline-item"><span class="tl-year">2022+</span><span class="tl-text">Era Verstappen: dominancia total de F1. El universo se reproduce a sí mismo — un piloto formado en el ecosistema RB lidera la mitología activa.</span></div>
    </div>
    <div class="section">
      <div class="section-title">Los objetos sagrados</div>
      <div class="sacred"><span class="sacred-icon">🥫</span><div class="sacred-text"><b>La lata de 250ml</b>Plateada, roja, delgada. 12 billones de latas vendidas. Instantáneamente reconocible en cualquier idioma europeo.</div></div>
      <div class="sacred"><span class="sacred-icon">🏁</span><div class="sacred-text"><b>El Red Bull Ring (Austria)</b>El circuito propio de F1. La única pista del calendario donde el universo es el anfitrión, no el patrocinador.</div></div>
      <div class="sacred"><span class="sacred-icon">✈️</span><div class="sacred-text"><b>El Hangar-7 (Salzburgo)</b>Aviones de acrobacia, autos históricos de carreras, restaurante Michelin. La catedral del universo europeo.</div></div>
      <div class="sacred"><span class="sacred-icon">🏎️</span><div class="sacred-text"><b>El casco de Verstappen</b>El objeto sagrado activo de la mitología contemporánea. Cada diseño es un evento cultural propio.</div></div>
      <div class="sacred"><span class="sacred-icon">🐂</span><div class="sacred-text"><b>Los toros dorados</b>Símbolo heráldico. Dos toros, enfrentados, en tensión activa. La fuerza que se contiene para liberarse.</div></div>
    </div>
    <div class="section">
      <div class="section-title">Visión de futuro</div>
      <ul class="dim-list">
        <li>Consolidación como empresa de medios culturales europeos, no solo deportivos. El contenido como producto principal, la bebida como merchandising sagrado.</li>
        <li>Apertura del universo a atletas femeninas europeas con el mismo nivel de producción e inversión. La expansión mitológica más importante disponible hoy.</li>
        <li>Liderazgo en la intersección rendimiento físico + tecnológico: biometría, IA aplicada al entrenamiento, esports como disciplina de élite.</li>

  body:`
    <div class="section">
      <div class="section-title">Estado actual — definido y operativo</div>

      <p class="dim-text">El fan europeo de Red Bull — el que sigue F1 religiosamente, asiste al Cliff Diving, escucha los sets de Red Bull Music Academy — <strong style="color:#e4e4e4">no tiene un camino formal para escalar en el universo</strong> más allá de ser espectador pasivo. El universo carece de mecánicas de participación y recompensa para este arquetipo.</p>

const STATUS_META = {
  defined:{label:'Definido',bg:'rgba(34,197,94,.12)',color:'#4ade80'},
  partial:{label:'Parcial',bg:'rgba(234,179,8,.12)',color:'#fbbf24'},
  missing:{label:'No definido',bg:'rgba(107,114,128,.15)',color:'#9ca3af'}
};

let current = null;

function selectDim(id) {
  if(current === id) return;
  current = id;
  const d = DIMS[id];
  if(!d) return;

  // Update connections
  Object.keys(DIMS).forEach(k => {
    const conn = document.getElementById('conn-'+k);
    const node = document.getElementById('nd-'+k);
    if(!conn || !node) return;
    const nodeData = DIMS[k];
    if(k === id) {
      conn.setAttribute('stroke', nodeData.color);
      conn.setAttribute('stroke-width','1.8');
      conn.setAttribute('stroke-opacity','0.8');
      node.classList.add('active');
    } else {
      conn.setAttribute('stroke', 'rgba(255,255,255,0.06)');
      conn.setAttribute('stroke-width','0.6');
      conn.setAttribute('stroke-opacity','1');
      node.classList.remove('active');
    }
  });
  // Handle platform node
  const platNode = document.getElementById('nd-platform');
  if(platNode) { id === 'brand_platform' ? platNode.classList.add('active') : platNode.classList.remove('active'); }

  // Update panel
  const sm = STATUS_META[d.status] || STATUS_META.defined;
  document.getElementById('ph-dim').textContent = d.sublabel || 'Capa 1';
  document.getElementById('ph-dim').style.color = d.color;
  document.getElementById('ph-title').textContent = d.label;
  document.getElementById('ph-title').style.color = d.color;
  document.getElementById('ph-question').textContent = d.question || '';

  let statusHTML = '';
  if(d.status && d.status !== 'defined') {
    statusHTML = `<span class="ph-status" style="background:${sm.bg};color:${sm.color}">${sm.label}</span>`;
  }
  let existing = document.querySelector('.ph-status');
  if(existing) existing.remove();
  if(statusHTML) document.getElementById('panel-header').insertAdjacentHTML('beforeend', statusHTML);

  document.getElementById('panel-body').innerHTML = d.body || '';
  document.getElementById('hint').style.opacity = '0';
}

// Init: show brand platform
selectDim('brand_platform');
</script>
